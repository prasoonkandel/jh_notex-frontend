<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update User Info</title>
        <link rel="stylesheet" href="/part.css" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="/loader.css" />

        <script src="/loader.js" defer></script>
        <script src="/protected-check.js"></script>
    </head>
    <body>
        <div
            class="page-loader"
            id="page-loader"
            role="status"
            aria-live="polite"
            aria-label="Loading JingHua Notex"
        >
            <img src="/logo.svg" alt="" width="76" height="76" />
            <span class="page-loader-label">Loading</span>
            <div class="page-loader-progress" aria-hidden="true">
                <span></span>
            </div>
        </div>
        <a href="../"><div class="back-home btn">&larr; Go Back</div></a>
        <main class="update-main">
            <section class="update-content">
                <h1 id="update-title">User Information</h1>
                <form class="update-form" id="update-form">
                    <div class="form-field">
                        <label for="username">Username</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        />
                    </div>

                    <p class="form-message" id="form-message" role="alert"></p>

                    <button class="update-button" id="update" type="submit">
                        Save Changes
                    </button>
                </form>
            </section>
        </main>
        <script src="/config.js"></script>
        <script src="../service.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
