<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Note | JingHua Notex</title>
        <link rel="stylesheet" href="/part.css" />
        <link rel="stylesheet" href="../updateAccount/style.css" />
        <link rel="stylesheet" href="/loader.css" />

        <script src="/loader.js" defer></script>
    </head>
    <body>
        <div
            class="page-loader"
            id="page-loader"
            role="status"
            aria-live="polite"
            aria-label="Loading JingHua Notex"
        >
            <img src="/logo.svg" alt="" width="76" height="76" />
            <span class="page-loader-label">Loading</span>
            <div class="page-loader-progress" aria-hidden="true">
                <span></span>
            </div>
        </div>

        <a href="../"><div class="back-home btn">&larr; Go Back</div></a>
        <main class="update-main">
            <section class="update-content">
                <h1 id="update-title">Create Note</h1>

                <form class="update-form" id="note-form">
                    <div class="form-field">
                        <label for="title">Title</label>
                        <input
                            id="title"
                            name="title"
                            type="text"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        />
                    </div>

                    <p class="form-message" id="form-message" role="alert"></p>

                    <button
                        class="update-button"
                        id="create-note"
                        type="submit"
                    >
                        Create Note
                    </button>
                </form>
            </section>
        </main>
        <script src="/config.js"></script>
        <script src="../service.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
