<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAEEE7" />
    <title>JingHua Notex</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="../protected-check.js"></script>
    <script src="../config.js"></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div
      class="page-loader"
      id="page-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading your dashboard">
      <img src="/logo.svg" alt="" width="76" height="76" />
      <span class="page-loader-label">Loading your dashboard</span>
      <div class="page-loader-progress" aria-hidden="true"><span></span></div>
    </div>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../" aria-label="JingHua Notex home">
          <span class="brand-name">
            <img src="/logo.svg" alt="JingHua Notex" />
          </span>
        </a>
        <nav class="site-nav" aria-label="User navigation">
          <button
            class="profile-button"
            id="profile-button"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="profile-menu">
            <i class="fa-solid fa-circle-user"></i>
          </button>
          <div
            class="profile-menu"
            id="profile-menu"
            role="menu"
            aria-labelledby="profile-button"
            hidden>
            <button type="button" role="menuitem">Change username</button>
            <button type="button" role="menuitem">Change password</button>
            <button id="sign-out" type="button" role="menuitem">
              Sign out
            </button>
            <button id="delete-account" type="button" role="menuitem">
              Delete Account
            </button>
          </div>
        </nav>
      </div>
    </header>
    <main class="container welcome">
      <h1 class="welcome-heading">Welcome, <span id="user">User</span>!</h1>
    </main>
  </body>
</html>
