<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#FAEEE7" />
        <title>JingHua Notex Dashboard</title>
        <link rel="icon" type="icon" href="../public/favicon.ico" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <link rel="stylesheet" href="/root.css" />
        <link rel="stylesheet" href="/part.css" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="/loader.css" />
        <script src="/loader.js" defer></script>
        <script src="../protected-check.js"></script>
        <script src="../config.js"></script>
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div
            class="page-loader"
            id="page-loader"
            role="status"
            aria-live="polite"
            aria-label="Loading your dashboard"
            data-manual
        >
            <img src="/logo.svg" alt="" width="76" height="76" />
            <span class="page-loader-label">Loading your dashboard</span>
            <div class="page-loader-progress" aria-hidden="true">
                <span></span>
            </div>
        </div>

        <header class="site-header">
            <div class="container header-inner">
                <a class="brand" href="../" aria-label="JingHua Notex home">
                    <span class="brand-name">
                        <img src="/logo.svg" alt="JingHua Notex" />
                    </span>
                </a>
                <nav class="site-nav" aria-label="User navigation">
                    <button
                        class="profile-button"
                        id="profile-button"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="profile-menu"
                    >
                        <i class="fa-solid fa-circle-user"></i>
                    </button>
                    <div
                        class="profile-menu"
                        id="profile-menu"
                        role="menu"
                        hidden
                    >
                        <button type="button" id="updateUser" role="menuitem">
                            Update username
                        </button>
                        <button
                            type="button"
                            id="changePassword"
                            role="menuitem"
                        >
                            Change password
                        </button>
                        <button id="signOut" type="button" role="menuitem">
                            Sign out
                        </button>
                        <button
                            id="deleteAccount"
                            type="button"
                            role="menuitem"
                        >
                            Delete Account
                        </button>
                    </div>
                </nav>
            </div>
        </header>
        <main class="container welcome">
            <h1 class="welcome-heading">
                Welcome, <span id="user">User</span>!
            </h1>

            <section id="notes-section" class="notes-section">
                <div class="notes-toolbar" id="notes-toolbar" hidden>
                    <label class="notes-search" for="notes-search-input">
                        <i
                            class="fa-solid fa-magnifying-glass"
                            aria-hidden="true"
                        ></i>
                        <span class="visually-hidden">Search notes</span>
                        <input
                            id="notes-search-input"
                            type="search"
                            placeholder="Search your notes"
                            autocomplete="off"
                        />
                    </label>

                    <button
                        class="add-note-button btn"
                        id="add-note-toolbar"
                        type="button"
                    >
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        <span>Add note</span>
                    </button>
                </div>

                <div class="notes-panel">
                    <div class="notes-panel-header">
                        <h2 class="notes-heading">Your Notes</h2>
                        <span class="notes-count">0 notes</span>
                    </div>

                    <div id="notes-list" class="notes-list"></div>

                    <div id="notes-empty" class="notes-empty" hidden>
                        <i
                            class="fa-regular fa-note-sticky"
                            aria-hidden="true"
                        ></i>

                        <h3>You currently have no notes.</h3>

                        <button
                            class="add-note-button btn"
                            id="add-note-empty"
                            type="button"
                        >
                            <i class="fa-solid fa-plus" aria-hidden="true"></i>
                            <span>Add one</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
