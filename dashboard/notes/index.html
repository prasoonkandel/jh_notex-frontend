<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta name="theme-color" content="#FAEEE7" />

        <title>Note Editor | JingHua Notex</title>

        <link rel="icon" href="/favicon.ico" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />

        <link rel="stylesheet" href="../../part.css" />
        <link rel="stylesheet" href="../../loader.css" />

        <link rel="stylesheet" href="./style.css" />

        <script src="/loader.js" defer></script>
        <script src="/protected-check.js"></script>
        <script src="/config.js"></script>

        <script type="module" src="./script.js"></script>
    </head>

    <body>
        <div
            class="page-loader"
            id="page-loader"
            role="status"
            aria-live="polite"
            aria-label="Loading your note"
            data-manual
        >
            <img src="/logo.svg" alt="" width="76" height="76" />

            <span class="page-loader-label"> Loading your note </span>

            <div class="page-loader-progress" aria-hidden="true">
                <span></span>
            </div>
        </div>

        <header class="site-header editor-header">
            <div class="container editor-header-inner">
                <div class="editor-navigation">
                    <a
                        class="brand"
                        href="/dashboard/"
                        aria-label="JingHua Notex dashboard"
                    >
                        <img
                            src="/logo.svg"
                            alt="JingHua Notex"
                            width="46"
                            height="46"
                        />
                    </a>

                    <span class="header-divider" aria-hidden="true"></span>

                    <a href="/dashboard/" class="back-link">
                        <i
                            class="fa-solid fa-arrow-left"
                            aria-hidden="true"
                        ></i>

                        <span>My Notes</span>
                    </a>
                </div>

                <div class="editor-actions" id="editor-actions" hidden>
                    <span
                        id="save-status"
                        class="save-status"
                        role="status"
                        aria-live="polite"
                    >
                        Loading...
                    </span>

                    <button
                        id="save-button"
                        class="save-button"
                        type="button"
                        disabled
                    >
                        <i
                            class="fa-solid fa-floppy-disk"
                            aria-hidden="true"
                        ></i>

                        <span>Save</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="editor-main">
            <section
                id="note-document"
                class="note-document"
                aria-label="Note editor"
                hidden
            >
                <h1
                    id="document-title-heading"
                    class="document-title"
                    aria-label="Note title"
                >
                    <label class="visually-hidden" for="note-title">
                        Note title
                    </label>

                    <input
                        id="note-title"
                        type="text"
                        placeholder="Untitled Note"
                        maxlength="100"
                        autocomplete="off"
                        aria-required="true"
                        disabled
                    />
                </h1>

                <p id="title-error" class="title-error" role="alert" hidden></p>

                <div class="document-divider"></div>

                <div
                    id="note-editor"
                    class="note-editor"
                    aria-label="Note content"
                ></div>
            </section>

            <section
                id="note-error"
                class="note-error"
                aria-labelledby="note-error-title"
                hidden
            >
                <div class="error-icon" aria-hidden="true">
                    <i class="fa-regular fa-file-circle-xmark"></i>
                </div>

                <p class="error-eyebrow">JINGHUA NOTEX</p>

                <h1 id="note-error-title">Note not found</h1>

                <p id="note-error-description" class="error-description">
                    This note may have been deleted or is no longer available.
                </p>

                <div class="error-actions">
                    <a
                        href="/dashboard/"
                        id="error-back-link"
                        class="error-back"
                    >
                        <i
                            class="fa-solid fa-arrow-left"
                            aria-hidden="true"
                        ></i>

                        <span id="error-back-text"> Back to my notes </span>
                    </a>

                    <button
                        type="button"
                        id="retry-note"
                        class="error-retry"
                        hidden
                    >
                        <i
                            class="fa-solid fa-rotate-right"
                            aria-hidden="true"
                        ></i>

                        Try again
                    </button>
                </div>
            </section>
        </main>
    </body>
</html>
