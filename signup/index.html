<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3E4C9" />
    <meta
      name="description"
      content="Create a JingHua Notex account to make space for your ideas." />
    <title>Sign up</title>
    <link rel="stylesheet" href="../login/style.css" />
    <script src="signup.js" defer></script>
  </head>
  <body>
    <a href="../"><div class="back-home">&larr; Go Back Home</div></a>
    <main class="login-main">
      <section class="login-content">
        <h1 id="signup-title">Create your account</h1>

        <form class="login-form" id="signup-form">
          <div class="form-field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required />
            <p class="field-error" id="username-error"></p>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required />
            <p class="field-error" id="password-error"></p>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm password</label>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              required />
            <p class="field-error" id="confirm-password-error"></p>
          </div>

          <p class="form-message" id="form-message" role="alert"></p>

          <button class="login-button" type="submit">Create account</button>
        </form>

        <p class="signup-prompt">
          Already have an account? <a href="../login/">Log in</a>
        </p>
      </section>
    </main>
  </body>
</html>
