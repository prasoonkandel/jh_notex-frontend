<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="circle"></div>
            <h1> Welcome!</h1>
            <p>
                Create your account and start your journey with us. Join our community and discover something amazing.
            </p>
        </div>
        <div class="right">
            <h2> Create Account</h2>
            <p class="subtitle">
                Please fill in the details below.
            </p>
            <form>
                <div class="input-group">
                    <label> Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label> Email Address</label>
                    <input type="email" placeholder="Enter your email address" required>
                </div>
                <div class="input-group">
                    <label> Password</label>
                    <input type="password" placeholder="Create your strong password" required>
                </div>
                <div class="input-group">
                    <label> Confirm password</label>
                    <input type="password" placeholder="Confirm your strong password"required>
                </div>
                <div class="terms">
                    <input type="checkbox" required>
                    <span>
                        I agree to the <a href="#"> Terms& Conditions</a>
                    </span>
                </div>
                <button class="signup" type="submit">
                    Create Account
                </button>
            </form>
            <div class="login">
                Already have an account?
                <a href="#">
                    Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
